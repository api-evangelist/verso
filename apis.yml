description: >-
  Verso Corporation (NYSE: VRS) was a North American producer of coated papers
  including coated groundwood, coated freesheet, and specialty products used in
  magazines, catalogs, commercial print, books, and packaging. Headquartered in
  Miamisburg, Ohio, Verso operated mills in Wisconsin Rapids (Wisconsin),
  Escanaba (Michigan), Duluth (Minnesota), and historically Luke (Maryland).
  In March 2022, Swedish pulp and paper group BillerudKorsnäs (now Billerud)
  completed its acquisition of Verso for $825 million in cash, taking the
  company private and rebranding it as Billerud Americas Corporation. The
  Verso standalone brand, ticker, and corporate web presence have been retired;
  ongoing North American operations, paper grades, and customer relationships
  now sit inside Billerud's global business.
